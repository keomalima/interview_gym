<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'"></head><body><script>

      let logCount = 0;
      let logBytes = 0;

        try {
          return JSON.stringify(value, (_, item) => {
            if (++entries > 200) return '[truncated]';
            if (typeof item === 'bigint') return String(item) + 'n';
            if (typeof item === 'string') return item.slice(0, 2000);
            if (item && typeof item === 'object') {
              if (seen.has(item)) return '[circular]';
              seen.add(item);
            }
            return item;
          })?.slice(0, 2000) ?? String(value).slice(0, 2000);
        } catch { return '[unserializable]'; }

          if (logCount >= 100 || logBytes >= 24000) return;
          const text = args.slice(0, 10).map(stringify).join(' ').slice(0, 2000);
          logCount++; logBytes += text.length;
          send({ nonce, type: 'console', level, text });
          if (logCount === 100 || logBytes >= 24000) send({ nonce, type: 'console', level: 'warn', text: 'Console output limit reached.' });

        url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));

        if (scriptOnly) { send({ nonce, scriptComplete: true }); return; }

        if (typeof fn !== 'function') throw new Error('Export a function named ' + functionName);
        const value = await fn(...input);
        const serialized = JSON.stringify(value);
        if (serialized === undefined) throw new Error('Function returned undefined');
        if (serialized.length > 20000) throw new Error('Output exceeds 20 KB');
        send({ nonce, value: JSON.parse(serialized) });
      } catch (error) {
        send({ nonce, error: String(error instanceof Error ? error.message : error).slice(0, 2000) });
      } finally { if (url) URL.revokeObjectURL(url); }
    };

    if (event.source !== parent) return;
    if (event.data?.type === 'cancel') {
      if (activeWorker) activeWorker.terminate();
      activeWorker = undefined;
      return;

      if (result.data.type === 'console') {

      if (activeWorker === worker) activeWorker = undefined;
    };

      parent.postMessage({ type: 'execution-result', nonce, error: 'Execution worker failed' }, '*');

    };

  });

})();
